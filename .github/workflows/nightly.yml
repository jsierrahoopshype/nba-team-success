# Team Success nightly refresh, hm-ts-7f3a91c2-nightly.
# Every hour at :17 from 12:17 to 23:17 UTC, plus 02:17 and 05:17. Ramiro's Parquet files are refreshed
# around 13:00-13:30 UTC (Nov 24 2026: 13:12 UTC), and GitHub runs scheduled jobs hours late or not
# at all at busy times (Nov 24: four slots fired at 22:52, 01:49, 04:03 and 07:03, all before that
# day's update), so a few fixed slots were not enough. A run with nothing new prints UNCHANGED in every
# step, skips the build and commits nothing (about 1 minute; the repo is public, so minutes are free). The first run of a
# UTC date writes that date's story and fun facts (a quiet-day item if nothing new); a later run
# with newer games rewrites them; a run with nothing new commits nothing. Pulls ONLY the current season
# (Ramiro's 2026-27 Parquet files; nba-boxscores' season folder once it exists), re-reads honors only
# when nba-player-data's awards.json changed (scripts/awards_refresh.py), writes the day's "Last night"
# list (tonight's schedule from nba-editorial-bots' public schedule CSV, the file nba-head-to-head
# reads for "Tonight's duels"; cdn.nba.com refuses GitHub's runners), rebuilds the site
# (career totals and ranks include the season to date, so every page can move; about 40 seconds)
# and commits only what changed. No secrets, no tokens.
name: Nightly current season
on:
  schedule:
    - cron: "17 12-23,2,5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: nightly-current
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-nightly.txt
      - run: pip install -r requirements-nightly.txt
      - name: Update current season data
        id: update
        run: |
          out=$(python scripts/update_current.py)
          echo "$out"
          if echo "$out" | grep -q '^CHANGED'; then echo "changed=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Honors (only when nba-player-data's awards.json changed)
        id: awards
        run: |
          out=$(python scripts/awards_refresh.py)
          echo "$out"
          if echo "$out" | grep -q '^CHANGED'; then echo "changed=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Today in Team Success
        id: story
        run: |
          out=$(python scripts/daily_story.py)
          echo "$out"
          if echo "$out" | grep -q '^CHANGED'; then echo "changed=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Fun facts
        id: facts
        run: |
          out=$(python scripts/fun_facts.py)
          echo "$out"
          if echo "$out" | grep -q '^CHANGED'; then echo "changed=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Rebuild touched pages
        if: steps.update.outputs.changed == 'yes' || steps.awards.outputs.changed == 'yes' || steps.story.outputs.changed == 'yes' || steps.facts.outputs.changed == 'yes'
        run: python scripts/build_site.py
      # A failing test must never leave the site stale: the data and pages built above are committed
      # anyway (build_site.py itself failing still stops the run before this), and the run is marked
      # failed at the end so the problem is visible.
      - name: Tests
        id: tests
        continue-on-error: true
        if: steps.update.outputs.changed == 'yes' || steps.awards.outputs.changed == 'yes' || steps.story.outputs.changed == 'yes' || steps.facts.outputs.changed == 'yes'
        run: python -m pytest tests/ -q
      - name: Commit if changed
        if: steps.update.outputs.changed == 'yes' || steps.awards.outputs.changed == 'yes' || steps.story.outputs.changed == 'yes' || steps.facts.outputs.changed == 'yes'
        run: |
          git config user.name "team-success-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs assets player players lists stories seasons compare index.html how-we-count.html comparison-rules.html sitemap.xml
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Nightly: current season through $(python -c "import json;print(json.load(open('data/current.json'))['through'])")"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done
          exit 1
      - name: Tests failed (the build above was still committed)
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Tests failed after the nightly build; the data and pages were committed anyway. See the Tests step."
          exit 1
