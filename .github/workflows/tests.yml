# Runs the sanity tests on the committed data and pages, then the no-horizontal-scroll check on
# every page template (320 to 1920 px). No secrets.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pytest==8.3.3
      - run: python -m pytest tests/ -q
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save --no-package-lock playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/layout.js
